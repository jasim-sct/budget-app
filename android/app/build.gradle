plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.budget_lite"
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    defaultConfig {
        applicationId "com.example.budget_lite"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Optimize native library loading on 1GB RAM devices
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Split APKs by ABI to minimize binary size on slow eMMC storage
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            // Enable R8 code shrinking and resource minification
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
